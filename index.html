<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Apuntes de interfaces</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

    <style>
/* Contenedor */
.reveal .mermaid {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 1.5em auto;
    width: 100%;
    overflow: visible !important;
}

/* SVG: reducir font-size base */
.reveal .mermaid svg {
    font-size: 1.2rem !important; /*ajusto tamño del texto dentro de los nodos*/
    /* Ocupa todo el ancho disponible (el viewBox escala el contenido).
       max-height acota los diagramas altos: con viewBox el SVG se reduce sin
       deformarse, así nunca desborda y fitCurrentSlide no baja el k. */
    width: 100% !important;
    max-width: 100% !important;
    max-height: 38vh !important;
    height: auto !important;
    overflow: visible !important;
}

/* CRÍTICO: permitir wrap en los labels */
.reveal .mermaid .label div,
.reveal .mermaid .nodeLabel,
.reveal .mermaid .edgeLabel {
    white-space: normal !important;
    word-wrap: break-word !important;
    overflow: visible !important;
    min-width: auto !important;
    min-height: auto !important;
    /* Mermaid dimensiona foreignObject/rect como fontSize × líneas (line-height 1).
       Con el normal del navegador (~1.33) el texto crece y se sale del recuadro. */
    line-height: 1 !important;
}

/* Asegurar que los foreignObject no recorten */
.reveal .mermaid foreignObject {
    overflow: visible !important;
}

/* Nodos y aristas */
.reveal .mermaid .node text,
.reveal .mermaid .edgeLabel text {
    font-size: 10px !important;
    line-height: 1.3;
}

/* Slides sin recorte */
.reveal .slides section.slide-fitted {
    overflow-y: auto;
}

        .reveal pre code {
            max-height: 9em;
            overflow-y: auto;
            font-size: 80%;
        }

        .toolbar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .toolbar select {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.92);
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            outline: none;
            max-width: 200px;
        }

        .toolbar select:hover {
            border-color: #999;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            color: #888;
            z-index: 200;
            font-family: system-ui, sans-serif;
        }

        .reveal .mermaid-error {
            display: block;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 6px;
            padding: 12px;
            color: #c53030;
            font-size: 12px;
            white-space: pre-wrap;
            text-align: left;
            margin: 0.5em 0;

        }

.diapositiva {
    font-size: 1.5em;
}

.mini {
    font-size: 0.85em;
}

/* Tamaño base del texto: un poco más grande que el valor por defecto del tema */
:root {
    --r-main-font-size: 44px;
}

/* Fragment: solo animar propiedades visuales. Con `transition: all` (regla de
   reveal.css) el font-size heredado también se anima y fitCurrentSlide, al medir
   de forma síncrona, ve un layout viejo y encoge la diapositiva de más. */
.reveal .fragment {
    transition: opacity .2s ease, visibility .2s ease, transform .2s ease,
                color .2s ease, text-decoration .2s ease;
}

/* URLs y tokens largos: partir línea en vez de forzar overflow de ancho */
.reveal li,
.reveal p {
    overflow-wrap: anywhere;
}

/* Tablas: partir palabra en celda estrecha para que la tabla quepa */
.reveal td,
.reveal th {
    overflow-wrap: anywhere;
}

/* La primera columna son etiquetas cortas (Nivel, Negocio…): no partir palabras.
   El resto de columnas conserva anywhere para que la tabla siempre quepa. */
.reveal td:first-child,
.reveal th:first-child {
    overflow-wrap: normal;
    word-break: normal;
}
    </style>
</head>
<body>

    <div class="toolbar">
        <select id="theme-selector" title="Tema"></select>
        <select id="unit-selector" title="Seleccionar unidad"></select>
    </div>

    <div id="loading">Cargando presentación…</div>

    <div class="reveal">
        <div class="slides"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <script>
        (function () {
            'use strict';

            const MD_RE = /```mermaid\s*\n([\s\S]*?)```/g;
            const SEPARATOR = '^---\\r?$';
            const SEPARATOR_VERT = '^--\\r?$';

            const units = [
                'introduccion.md',
                'unidad-00.md',
                'unidad-01.md',
                'unidad-02.md',
                'unidad-03.md',
                'unidad-04.md',
                'unidad-05.md',
                'unidad-06.md',
                'unidad-07.md',
                'unidad-08.md',
                'unidad-09.md',
                'unidad-10.md',
                'unidad-11.md',
                'unidad-12.md',
                'unidad-13.md',
                'unidad-14.md',
                'unidad-15.md'
            ];

            const unitLabels = {
                'introduccion.md': 'Introduccion',
                'unidad-00.md': 'U0 · Normativa y marco curricular',
                'unidad-01.md': 'U1 · Fundamentos de CSS',
                'unidad-02.md': 'U2 · Selectores',
                'unidad-03.md': 'U3 · Modelo de caja',
                'unidad-04.md': 'U4 · Posicionamiento y z-index',
                'unidad-05.md': 'U5 · Flexbox',
                'unidad-06.md': 'U6 · Grid',
                'unidad-07.md': 'U7 · Flujo, multicolumna y display',
                'unidad-08.md': 'U8 · Unidades, tipografia y colores',
                'unidad-09.md': 'U9 · Fondos, imagenes y decoracion',
                'unidad-10.md': 'U10 · Diseno responsivo',
                'unidad-11.md': 'U11 · Transiciones y animaciones',
                'unidad-12.md': 'U12 · CSS moderno y arquitectura',
                'unidad-13.md': 'U13 · Accesibilidad y usabilidad',
                'unidad-14.md': 'U14 · Rendimiento y buenas practicas',
                'unidad-15.md': 'U15 · Ejercicios, glosario y recursos'
            };

            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                fontFamily: 'inherit',
                flowchart: {
                    useMaxWidth: true,
                    htmlLabels: true,
                    padding: 14,       // ← Padding interno de nodos
                    nodeSpacing: 30,   // ← Más espacio entre nodos
                    rankSpacing: 55,   // ← Más espacio entre niveles
                    curve: 'basis'
                },
                themeVariables: {
                    fontSize: '1.2rem',   // ← Font-size base de Mermaid - Aquí agrando los nodos
                    fontFamily: 'Segoe UI, sans-serif'
                }

            });

            const params = new URLSearchParams(window.location.search);
            let currentMd = params.get('md') || units[0];
            if (!units.includes(currentMd)) currentMd = units[0];

            var themes = [
                { name: 'white',     label: 'White' },
                { name: 'black',     label: 'Black' },
                { name: 'league',    label: 'League' },
                { name: 'sky',       label: 'Sky' },
                { name: 'beige',     label: 'Beige' },
                { name: 'simple',    label: 'Simple' },
                { name: 'serif',     label: 'Serif' },
                { name: 'night',     label: 'Night' },
                { name: 'moon',      label: 'Moon' },
                { name: 'solarized', label: 'Solarized' },
                { name: 'blood',     label: 'Blood' },
                { name: 'dracula',   label: 'Dracula' },
            ];

            var defaultTheme = 'dracula';
            var currentTheme = params.get('theme') || localStorage.getItem('reveal-theme') || defaultTheme;

            var themeValid = themes.some(function (t) { return t.name === currentTheme; });
            if (!themeValid) currentTheme = defaultTheme;

            function applyTheme(name) {
                var theme = themes.find(function (t) { return t.name === name; });
                var href = theme.url || 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/' + name + '.css';
                document.getElementById('theme').href = href;
                localStorage.setItem('reveal-theme', name);
            }

            applyTheme(currentTheme);

            function buildUrl(md, theme) {
                var p = [];
                if (md && md !== units[0]) p.push('md=' + encodeURIComponent(md));
                if (theme && theme !== defaultTheme) p.push('theme=' + encodeURIComponent(theme));
                return p.length ? '?' + p.join('&') : '?';
            }

            var themeSel = document.getElementById('theme-selector');
            themes.forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.label;
                if (t.name === currentTheme) opt.selected = true;
                themeSel.appendChild(opt);
            });

            themeSel.addEventListener('change', function () {
                var md = params.get('md') || units[0];
                applyTheme(this.value);
                window.location.href = buildUrl(md, this.value);
            });

            var unitSelector = document.getElementById('unit-selector');
            units.forEach(function (file, index) {
                var opt = document.createElement('option');
                opt.value = file;
                opt.textContent = unitLabels[file] || ('Unidad ' + (index + 1));
                if (file === currentMd) opt.selected = true;
                unitSelector.appendChild(opt);
            });

            unitSelector.addEventListener('change', function () {
                window.location.href = buildUrl(this.value, currentTheme);
            });

            async function renderMermaidOnSlide(slide) {
                var els = slide.querySelectorAll('.mermaid:not([data-processed])');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    try {
                        var id = 'm-' + Math.random().toString(36).slice(2, 10);
                        var tmp = el.cloneNode(true);
                        var brs = tmp.getElementsByTagName('br');
                        for (var j = brs.length - 1; j >= 0; j--) {
                            brs[j].parentNode.replaceChild(document.createTextNode('<br>'), brs[j]);
                        }
                        var code = tmp.textContent.trim()
                            .replace(/<br\b[^>]*>/gi, '<br/>');
                        if (!code) continue;
                        var result = await mermaid.render(id, code);
                        el.innerHTML = result.svg;
                    } catch (e) {
                        el.innerHTML = '<pre class="mermaid-error">Error al renderizar diagrama:\n' + e.message + '</pre>';
                    }
                    el.setAttribute('data-processed', 'true');
                }
            }

            async function loadPresentation(mdFile) {
                try {
                    var resp = await fetch(mdFile);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    var content = await resp.text();

                    content = content.replace(MD_RE, function (_, code) {
                        return '<div class="mermaid">\n' + code.trim() + '\n</div>';
                    });

                    var titleMatch = content.match(/^##\s+(.*?)(?:\s*<!--.*-->)?$/m);
                    if (titleMatch) {
                        document.title = titleMatch[1];
                    }

                    var slidesEl = document.querySelector('.reveal .slides');
                    var section = document.createElement('section');
                    section.setAttribute('data-markdown', '');
                    section.setAttribute('data-separator', SEPARATOR);
                    section.setAttribute('data-separator-vertical', SEPARATOR_VERT);

                    var template = document.createElement('script');
                    template.type = 'text/template';
                    template.textContent = content;
                    section.appendChild(template);

                    slidesEl.innerHTML = '';
                    slidesEl.appendChild(section);

                    var deck = new Reveal({
                        hash: true,
                        center: true,
                        transition: 'slide',
                        margin: 0.04,
                        markdown: { smartypants: true },
                        plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
                    });
                    window.__deck = deck;

                    function fitCurrentSlide() {
                        var slide = deck.getCurrentSlide();
                        if (!slide) return;
                        var prevK = slide.style.fontSize ? (parseFloat(slide.style.fontSize) / 100) : 1;
                        if (!(prevK > 0)) prevK = 1;
                        slide.style.fontSize = '';
                        slide.style.top = '';
                        slide.classList.remove('slide-fitted');
                        var size = deck.getComputedSlideSize();
                        if (!size) return;
                        var availH = size.height;
                        var availW = size.width;
                        var needH = slide.scrollHeight;
                        var needW = slide.scrollWidth;
                        var fits = needH <= availH && needW <= availW;
                        if (!fits) {
                            // Búsqueda binaria del mayor k que cabe (H y W).
                            // Se guarda el string EXACTO probado: si el final
                            // redondeara distinto, un cambio de línea en el
                            // umbral desbordaría la diapositiva.
                            var lo = 0.45, loSize = '45.00%', hi = 1, k = 1;
                            for (var i = 0; i < 12; i++) {
                                k = (lo + hi) / 2;
                                slide.style.fontSize = (k * 100).toFixed(2) + '%';
                                if (slide.scrollHeight <= availH && slide.scrollWidth <= availW) {
                                    lo = k;
                                    loSize = slide.style.fontSize;
                                } else {
                                    hi = k;
                                }
                            }
                            slide.style.fontSize = loSize;
                        } else if (prevK < 1 && (needH > availH * 0.99 || needW > availW)) {
                            slide.style.fontSize = (prevK * 100).toFixed(1) + '%';
                        }
                        if (slide.scrollHeight > availH + 2) {
                            slide.classList.add('slide-fitted');
                        } else if (deck.getConfig().center && !slide.classList.contains('stack')) {
                            slide.style.top = Math.max((availH - slide.scrollHeight) / 2, 0) + 'px';
                        }
                    }

                    var settleTimer = null;
                    function scheduleSettleFit() {
                        if (settleTimer) clearTimeout(settleTimer);
                        settleTimer = setTimeout(fitCurrentSlide, 350);
                    }

                    function renderAndFit(slide) {
                        if (!slide) return;
                        fitCurrentSlide();
                        renderMermaidOnSlide(slide).then(fitCurrentSlide, fitCurrentSlide);
                        scheduleSettleFit();
                    }

                    deck.on('ready', function () {
                        document.getElementById('loading').style.display = 'none';
                        renderAndFit(deck.getCurrentSlide());
                    });

                    deck.on('slidechanged', function (event) {
                        renderAndFit(event && event.currentSlide);
                    });

                    deck.on('resize', fitCurrentSlide);
                    deck.on('fragmentshown', function () { fitCurrentSlide(); scheduleSettleFit(); });
                    deck.on('fragmenthidden', function () { fitCurrentSlide(); scheduleSettleFit(); });
                    var themeEl = document.getElementById('theme');
                    if (themeEl) {
                        themeEl.addEventListener('load', function () { fitCurrentSlide(); scheduleSettleFit(); });
                    }
                    setTimeout(fitCurrentSlide, 300);
                    [600, 1500, 3000].forEach(function (t) { setTimeout(fitCurrentSlide, t); });
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(fitCurrentSlide);
                    }
                    window.addEventListener('load', fitCurrentSlide);

                    await deck.initialize();

                } catch (error) {
                    document.getElementById('loading').textContent =
                        'Error al cargar ' + mdFile + ': ' + error.message;
                    console.error(error);
                }
            }

            loadPresentation(currentMd);
        })();
    </script>
    
</body>
</html>
